<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전압 전류 측정 문제기</title>
    <style>
        :root {
            --primary: #4A90E2;
            --secondary: #F3F4F6;
            --text-dark: #1F2937;
            --text-light: #6B7280;
            --danger: #EF4444;
            --success: #10B981;
            --white: #FFFFFF;
            --border: #E5E7EB;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #E2E8F0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--white);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        /* Header & Tabs */
        .header {
            padding: 20px 20px 0;
            text-align: center;
        }
        .header h1 {
            font-size: 20px;
            color: var(--text-dark);
            margin-bottom: 15px;
        }
        .tabs {
            display: flex;
            background-color: var(--secondary);
            border-radius: 10px;
            padding: 5px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            border-radius: 8px;
            font-weight: 600;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: var(--white);
            color: var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Content Area */
        .content-area {
            flex: 1;
            padding: 0 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .view {
            display: none;
        }
        .view.active {
            display: block;
        }

        /* Input Fields */
        .input-group {
            display: flex;
            align-items: center;
            background-color: var(--secondary);
            border-radius: 10px;
            padding: 10px 15px;
            margin-bottom: 10px;
            border: 2px solid transparent;
        }
        .input-group:focus-within {
            border-color: var(--primary);
        }
        .input-label {
            width: 80px;
            font-weight: bold;
            color: var(--text-dark);
        }
        .input-field {
            flex: 1;
            border: none;
            background: none;
            font-size: 18px;
            outline: none;
            color: var(--text-dark);
        }
        .input-unit {
            color: var(--text-light);
            font-weight: bold;
        }

        /* Buttons */
        .btn-action {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background-color: var(--primary);
            color: var(--white);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-action:hover {
            background-color: #357ABD;
        }
        .btn-secondary {
            background-color: var(--secondary);
            color: var(--text-dark);
            margin-top: 5px;
        }
        .btn-secondary:hover {
            background-color: var(--border);
        }

        /* Result & Solution Box */
        .result-box {
            background-color: #F8FAFC;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            display: none;
        }
        .solution-content {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-dark);
            display: none;
        }

        /* Study Mode Specific */
        .problem-box {
            background-color: #FFFBEB;
            border: 1px solid #FDE68A;
            border-radius: 10px;
            padding: 15px;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        .options-list {
            list-style: none;
        }
        .option-item {
            display: block;
            padding: 12px;
            margin-bottom: 8px;
            background-color: var(--white);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
        }
        .option-item:hover {
            background-color: var(--secondary);
        }
        input[type="radio"] {
            margin-right: 10px;
        }

        /* Keypad */
        .keypad {
            padding: 15px 20px 20px;
            background-color: var(--secondary);
            border-top: 1px solid var(--border);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .key-btn {
            background-color: var(--white);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px 0;
            font-size: 18px;
            font-weight: bold;
            color: var(--text-dark);
            cursor: pointer;
            box-shadow: 0 2px 0 rgba(0,0,0,0.05);
        }
        .key-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }
        .key-btn.special {
            background-color: #E0E7FF;
            color: var(--primary);
            font-size: 15px;
        }
        .key-btn.action {
            background-color: #FEE2E2;
            color: var(--danger);
        }
    </style>
</head>

        }
        .key-btn.action {
            background-color: #FEE2E2;
            color: var(--danger);
        }
    </style>
</head>
<body>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전압 전류 측정 문제기</title>
    <style>
        :root {
            --primary: #4A90E2;
            --secondary: #F3F4F6;
            --text-dark: #1F2937;
            --text-light: #6B7280;
            --danger: #EF4444;
            --success: #10B981;
            --white: #FFFFFF;
            --border: #E5E7EB;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #E2E8F0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--white);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        /* Header & Tabs */
        .header {
            padding: 20px 20px 0;
            text-align: center;
        }
        .header h1 {
            font-size: 20px;
            color: var(--text-dark);
            margin-bottom: 15px;
        }
        .tabs {
            display: flex;
            background-color: var(--secondary);
            border-radius: 10px;
            padding: 5px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            border-radius: 8px;
            font-weight: 600;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: var(--white);
            color: var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Content Area */
        .content-area {
            flex: 1;
            padding: 0 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .view {
            display: none;
        }
        .view.active {
            display: block;
        }

        /* Input Fields */
        .input-group {
            display: flex;
            align-items: center;
            background-color: var(--secondary);
            border-radius: 10px;
            padding: 10px 15px;
            margin-bottom: 10px;
            border: 2px solid transparent;
        }
        .input-group:focus-within {
            border-color: var(--primary);
        }
        .input-label {
            width: 80px;
            font-weight: bold;
            color: var(--text-dark);
        }
        .input-field {
            flex: 1;
            border: none;
            background: none;
            font-size: 18px;
            outline: none;
            color: var(--text-dark);
        }
        .input-unit {
            color: var(--text-light);
            font-weight: bold;
        }

        /* Buttons */
        .btn-action {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background-color: var(--primary);
            color: var(--white);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-action:hover {
            background-color: #357ABD;
        }
        .btn-secondary {
            background-color: var(--secondary);
            color: var(--text-dark);
            margin-top: 5px;
        }
        .btn-secondary:hover {
            background-color: var(--border);
        }

        /* Result & Solution Box */
        .result-box {
            background-color: #F8FAFC;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            display: none;
        }
        .solution-content {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-dark);
            display: none;
        }

        /* Study Mode Specific */
        .problem-box {
            background-color: #FFFBEB;
            border: 1px solid #FDE68A;
            border-radius: 10px;
            padding: 15px;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        .options-list {
            list-style: none;
        }
        .option-item {
            display: block;
            padding: 12px;
            margin-bottom: 8px;
            background-color: var(--white);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .option-item:hover {
            background-color: var(--secondary);
        }
        input[type="radio"] {
            margin-right: 10px;
        }

        /* Keypad */
        .keypad {
            padding: 15px 20px 20px;
            background-color: var(--secondary);
            border-top: 1px solid var(--border);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .key-btn {
            background-color: var(--white);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px 0;
            font-size: 18px;
            font-weight: bold;
            color: var(--text-dark);
            cursor: pointer;
            box-shadow: 0 2px 0 rgba(0,0,0,0.05);
        }
        .key-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }
        .key-btn.special {
            background-color: #E0E7FF;
            color: var(--primary);
            font-size: 15px;
        }
        .key-btn.action {
            background-color: #FEE2E2;
            color: var(--danger);
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>⚡ 전압 전류 측정 문제기</h1>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('measure')">측정 모드</button>
            <button class="tab-btn" onclick="switchTab('study')">심화 공부 모드</button>
        </div>
    </div>

    <div class="content-area">
        <!-- 측정 모드 (계산기) -->
        <div id="measure-view" class="view active">
            <p style="font-size: 13px; color: var(--text-light); margin-bottom: 10px;">
                * 2개의 값을 입력하면 나머지를 계산해 드립니다.
            </p>
            <div class="input-group">
                <span class="input-label">전압 (V)</span>
                <input type="text" class="input-field calc-input" id="inp-v" placeholder="0" inputmode="none">
                <span class="input-unit">V</span>
            </div>
            <div class="input-group">
                <span class="input-label">전류 (I)</span>
                <input type="text" class="input-field calc-input" id="inp-i" placeholder="0" inputmode="none">
                <span class="input-unit">A</span>
            </div>
            <div class="input-group">
                <span class="input-label">저항 (R)</span>
                <input type="text" class="input-field calc-input" id="inp-r" placeholder="0" inputmode="none">
                <span class="input-unit">Ω</span>
            </div>
            <div class="input-group">
                <span class="input-label">전력 (P)</span>
                <input type="text" class="input-field calc-input" id="inp-p" placeholder="0" inputmode="none">
                <span class="input-unit">W</span>
            </div>
            
            <button class="btn-action" onclick="calculate()">계산하기</button>
            <button class="btn-action btn-secondary" onclick="resetCalculator()">초기화</button>

            <div class="result-box" id="result-box">
                <h3 style="margin-bottom: 10px; color: var(--primary);">결과</h3>
                <div id="result-text" style="font-size: 16px; font-weight: bold; margin-bottom: 15px;"></div>
                <button class="btn-action btn-secondary" style="padding: 10px; font-size: 14px;" onclick="toggleSolution()">📝 단계별 풀이 보기</button>
                <div class="solution-content" id="solution-content"></div>
            </div>
        </div>

        <!-- 공부 모드 (문제 출제) -->
        <div id="study-view" class="view">
            <p style="font-size: 13px; color: var(--text-light); margin-bottom: 10px;">
                * 하단 키패드의 '직렬/병렬'을 눌러 고난도 조건부 문제를 풀어보세요. 부분 전압과 소비 전력까지 계산해야 합니다.
            </p>
            <button class="btn-action" onclick="generateProblem()">랜덤 문제 출제하기</button>
            
            <div id="problem-area" style="display: none; margin-top: 15px;">
                <div class="problem-box" id="problem-text"></div>
                <ul class="options-list" id="options-list">
                    <!-- Options injected via JS -->
                </ul>
                <button class="btn-action" onclick="checkAnswer()">정답 확인</button>
            </div>
        </div>
    </div>

    <!-- 커스텀 키패드 -->
    <div class="keypad">
        <button class="key-btn" onclick="insertKey('7')">7</button>
        <button class="key-btn" onclick="insertKey('8')">8</button>
        <button class="key-btn" onclick="insertKey('9')">9</button>
        <button class="key-btn special" onclick="insertKey('/')">x/y</button>

        <button class="key-btn" onclick="insertKey('4')">4</button>
        <button class="key-btn" onclick="insertKey('5')">5</button>
        <button class="key-btn" onclick="insertKey('6')">6</button>
        <button class="key-btn special" onclick="insertKey('√')">√</button>

        <button class="key-btn" onclick="insertKey('1')">1</button>
        <button class="key-btn" onclick="insertKey('2')">2</button>
        <button class="key-btn" onclick="insertKey('3')">3</button>
        <button class="key-btn special" style="background-color:#FDE68A; color:#92400E;" onclick="triggerCircuit('직렬')">직렬(심화)</button>

        <button class="key-btn" onclick="insertKey('.')">.</button>
        <button class="key-btn" onclick="insertKey('0')">0</button>
        <button class="key-btn action" onclick="insertKey('backspace')">⌫</button>
        <button class="key-btn special" style="background-color:#FDE68A; color:#92400E;" onclick="triggerCircuit('병렬')">병렬(심화)</button>
    </div>
</div>

<script>
    let currentMode = 'measure';
    let focusedInput = null;
    let currentCorrectAnswer = 0;

    // Track focused input for keypad
    document.querySelectorAll('.calc-input').forEach(input => {
        input.addEventListener('focus', (e) => {
            focusedInput = e.target;
        });
    });

    function switchTab(mode) {
        currentMode = mode;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
        
        if (mode === 'measure') {
            document.querySelector('.tabs button:nth-child(1)').classList.add('active');
            document.getElementById('measure-view').classList.add('active');
        } else {
            document.querySelector('.tabs button:nth-child(2)').classList.add('active');
            document.getElementById('study-view').classList.add('active');
        }
    }

    function insertKey(val) {
        if (currentMode !== 'measure' || !focusedInput) return;
        
        if (val === 'backspace') {
            focusedInput.value = focusedInput.value.slice(0, -1);
        } else {
            focusedInput.value += val;
        }
    }

    function triggerCircuit(type) {
        if (currentMode !== 'study') {
            alert('심화 문제 출제는 공부 모드에서만 사용 가능합니다.');
            switchTab('study');
            return;
        }
        generateProblem(type);
    }

    function parseValue(valStr) {
        if (!valStr) return null;
        valStr = valStr.replace(/ /g, '');
        try {
            if (valStr.includes('√')) {
                let num = parseFloat(valStr.replace('√', ''));
                if (num < 0) throw new Error("음수의 제곱근");
                return Math.sqrt(num);
            }
            if (valStr.includes('/')) {
                let parts = valStr.split('/');
                if (parseFloat(parts[1]) === 0) throw new Error("0으로 나누기");
                return parseFloat(parts[0]) / parseFloat(parts[1]);
            }
            return parseFloat(valStr);
        } catch (e) {
            return NaN;
        }
    }

    // 최소공배수 구하기 (병렬 전압 계산용)
    function getLCM(a, b) {
        const gcd = (x, y) => (!y ? x : gcd(y, x % y));
        return (a * b) / gcd(a, b);
    }

    function calculate() {
        let v = parseValue(document.getElementById('inp-v').value);
        let i = parseValue(document.getElementById('inp-i').value);
        let r = parseValue(document.getElementById('inp-r').value);
        let p = parseValue(document.getElementById('inp-p').value);

        let inputs = [
            { name: 'V', val: v }, { name: 'I', val: i },
            { name: 'R', val: r }, { name: 'P', val: p }
        ].filter(x => x.val !== null && !isNaN(x.val));

        if (inputs.length < 2) {
            alert("최소 2개의 값을 입력해주세요.");
            return;
        }
        if (r !== null && r < 0) {
            alert("물리적 오류: 저항(R)은 음수가 될 수 없습니다.");
            return;
        }
        if (v === 0 && i !== null && i !== 0 && r !== null && r !== 0) {
            alert("물리적 오류: 전압이 0일 때 전류나 저항이 유효한 값을 가질 수 없습니다.");
            return;
        }

        let solutionHTML = "";
        if (v !== null && i !== null) {
            if (i === 0) { alert("전류가 0이면 저항을 계산할 수 없습니다 (단선)."); return; }
            r = v / i;
            p = v * i;
            solutionHTML = `<b>1. 저항(R) 계산</b><br>옴의 법칙: R = V / I<br>R = ${v} / ${i} = <b>${r.toFixed(2)} Ω</b><br><br><b>2. 전력(P) 계산</b><br>전력 공식: P = V × I<br>P = ${v} × ${i} = <b>${p.toFixed(2)} W</b>`;
        } else if (v !== null && r !== null) {
            if (r === 0) { alert("저항이 0이면 전류가 무한대가 됩니다 (쇼트 오류)."); return; }
            i = v / r;
            p = (v * v) / r;
            solutionHTML = `<b>1. 전류(I) 계산</b><br>옴의 법칙: I = V / R<br>I = ${v} / ${r} = <b>${i.toFixed(2)} A</b><br><br><b>2. 전력(P) 계산</b><br>전력 공식: P = V² / R<br>P = ${v}² / ${r} = <b>${p.toFixed(2)} W</b>`;
        } else if (i !== null && r !== null) {
            v = i * r;
            p = i * i * r;
            solutionHTML = `<b>1. 전압(V) 계산</b><br>옴의 법칙: V = I × R<br>V = ${i} × ${r} = <b>${v.toFixed(2)} V</b><br><br><b>2. 전력(P) 계산</b><br>전력 공식: P = I² × R<br>P = ${i}² × ${r} = <b>${p.toFixed(2)} W</b>`;
        } else {
            alert("현재 프로토타입은 (V,I), (V,R), (I,R) 조합을 우선 지원합니다.");
            return;
        }

        document.getElementById('inp-v').value = v.toFixed(2).replace(/\.00$/, '');
        document.getElementById('inp-i').value = i.toFixed(2).replace(/\.00$/, '');
        document.getElementById('inp-r').value = r.toFixed(2).replace(/\.00$/, '');
        document.getElementById('inp-p').value = p.toFixed(2).replace(/\.00$/, '');

        document.getElementById('result-text').innerHTML = `V = ${v.toFixed(2)}V, &nbsp; I = ${i.toFixed(2)}A <br> R = ${r.toFixed(2)}Ω, &nbsp; P = ${p.toFixed(2)}W`;
        document.getElementById('solution-content').innerHTML = solutionHTML;
        document.getElementById('result-box').style.display = 'block';
        document.getElementById('solution-content').style.display = 'none';
    }

    function toggleSolution() {
        let sol = document.getElementById('solution-content');
        sol.style.display = sol.style.display === 'none' ? 'block' : 'none';
    }

    function resetCalculator() {
        document.querySelectorAll('.calc-input').forEach(inp => inp.value = '');
        document.getElementById('result-box').style.display = 'none';
        focusedInput = null;
    }

    // 초고난도 문제 출제 로직
    function generateProblem(type = 'normal') {
        document.getElementById('problem-area').style.display = 'block';
        let problemText = "";
        let ans = 0;
        let unit = "";

        if (type === '직렬') {
            // 직렬: 2개 또는 3개의 저항 (어려운 숫자 사용)
            let isThree = Math.random() < 0.4; // 40% 확률로 3개 저항
            let r1 = (Math.floor(Math.random() * 8) + 2) * 5; // 10, 15, 20...50
            let r2 = (Math.floor(Math.random() * 8) + 2) * 5;
            let r3 = isThree ? (Math.floor(Math.random() * 6) + 2) * 5 : 0;
            
            let totalR = r1 + r2 + r3;
            let i = Math.floor(Math.random() * 5) + 2; // 2A ~ 6A
            let v = totalR * i;

            let subType = Math.floor(Math.random() * 4);
            let resText = `${r1}Ω, ${r2}Ω${isThree ? `, ${r3}Ω` : ''}`;

            if (subType === 0) { // 부분 전압 묻기
                problemText = `전압이 <b>${v}V</b>인 전원에 ${resText}의 저항이 <b>직렬</b>로 연결되어 있다. 이 중 <b>${r2}Ω 저항에 걸리는 전압(V)</b>은 얼마인가? (힌트: 먼저 전체 전류를 구하세요)`;
                ans = i * r2; unit = "V";
            } else if (subType === 1) { // 소비 전력 묻기
                problemText = `전압이 <b>${v}V</b>인 전원에 ${resText}의 저항이 <b>직렬</b>로 연결되어 있다. <b>${r1}Ω 저항에서 소비되는 전력(P)</b>은 얼마인가? (단위: W)`;
                ans = i * i * r1; unit = "W";
            } else if (subType === 2) { // 전체 전력 묻기
                problemText = `전압이 <b>${v}V</b>인 전원에 ${resText}의 저항이 <b>직렬</b>로 연결되어 있다. 회로 <b>전체에서 소비되는 총 전력(P)</b>은 얼마인가?`;
                ans = v * i; unit = "W";
            } else { // 기본 전체 전류
                problemText = `전압이 <b>${v}V</b>인 전원에 ${resText}의 저항이 <b>직렬</b>로 연결되어 있다. 회로에 흐르는 <b>전체 전류(I)</b>는 얼마인가?`;
                ans = i; unit = "A";
            }

        } else if (type === '병렬') {
            // 병렬: 다양한 케이스 준비. 
            const parallelSets = [
                {r1: 30, r2: 60, r3: 0, rt: 20},
                {r1: 20, r2: 30, r3: 0, rt: 12},
                {r1: 12, r2: 24, r3: 0, rt: 8},
                {r1: 60, r2: 40, r3: 0, rt: 24},
                {r1: 100, r2: 25, r3: 0, rt: 20},
                {r1: 15, r2: 30, r3: 0, rt: 10},
                {r1: 10, r2: 40, r3: 0, rt: 8},
                {r1: 12, r2: 6, r3: 4, rt: 2}, // 3개짜리
                {r1: 20, r2: 20, r3: 10, rt: 5} // 3개짜리
            ];
            
            // 배수를 적용해 매번 답이 달라지게 만듦 (x1, x2, x3)
            let multiplier = Math.floor(Math.random() * 3) + 1; 
            let baseSet = parallelSets[Math.floor(Math.random() * parallelSets.length)];
            
            let r1 = baseSet.r1 * multiplier;
            let r2 = baseSet.r2 * multiplier;
            let r3 = baseSet.r3 * multiplier;
            let totalR = baseSet.rt * multiplier;

            // 전압을 저항들의 최소공배수의 배수로 설정하여 전류가 깔끔하게 떨어지게 만듦
            let r_lcm = r3 === 0 ? getLCM(r1, r2) : getLCM(getLCM(r1, r2), r3);
            let v = r_lcm * (Math.floor(Math.random() * 2) + 1); 
            let totalI = v / totalR;

            let subType = Math.floor(Math.random() * 4);
            let resText = `${r1}Ω, ${r2}Ω${r3 !== 0 ? `, ${r3}Ω` : ''}`;

            if (subType === 0) { // 부분 전류 묻기
                problemText = `전압이 <b>${v}V</b>인 전원에 ${resText}의 저항이 <b>병렬</b>로 연결되어 있다. 이 중 <b>${r1}Ω 저항에 흐르는 전류(I)</b>는 얼마인가?`;
                ans = v / r1; unit = "A";
            } else if (subType === 1) { // 개별 소비 전력 묻기
                problemText = `전압이 <b>${v}V</b>인 전원에 ${resText}의 저항이 <b>병렬</b>로 연결되어 있다. <b>${r2}Ω 저항 한 곳에서만 소비되는 전력(P)</b>은 얼마인가? (단위: W)`;
                ans = (v * v) / r2; unit = "W";
            } else if (subType === 2) { // 전체 전압 역추산
                problemText = `${resText}의 저항이 <b>병렬</b>로 연결된 회로에 <b>전체 전류 ${totalI}A</b>가 흐르고 있다. 이 회로에 공급된 <b>전체 전압(V)</b>은 얼마인가? (힌트: 합성 저항을 먼저 구하세요)`;
                ans = v; unit = "V";
            } else { // 기본 전체 전류
                problemText = `전압이 <b>${v}V</b>인 전원에 ${resText}의 저항이 <b>병렬</b>로 연결되어 있다. 회로에 흐르는 <b>전체 전류(I)</b>는 얼마인가?`;
                ans = totalI; unit = "A";
            }
        } else {
            // 기본 옴의 법칙 (V, I, R) 랜덤 출제
            let types = ['V', 'I', 'R'];
            let target = types[Math.floor(Math.random() * types.length)];
            let i = Math.floor(Math.random() * 9) + 2;
            let r = Math.floor(Math.random() * 9) + 2;
            let v = i * r;

            if (target === 'V') {
                problemText = `어떤 회로의 저항이 ${r}Ω이고, 흐르는 전류가 ${i}A이다. 이 회로에 걸린 전압(V)은 얼마인가?`;
                ans = v; unit = "V";
            } else if (target === 'I') {
                problemText = `전압이 ${v}V인 회로에 ${r}Ω의 저항이 연결되어 있다. 흐르는 전류(I)는 얼마인가?`;
                ans = i; unit = "A";
            } else {
                problemText = `전압이 ${v}V이고 흐르는 전류가 ${i}A인 회로가 있다. 이 회로의 저항(R)은 얼마인가?`;
                ans = r; unit = "Ω";
            }
        }

        currentCorrectAnswer = ans;
        document.getElementById('problem-text').innerHTML = problemText;

        // 정답 크기에 비례하여 그럴듯한 오답 생성 (난이도 상승)
        let options = new Set([ans]);
        let safeCount = 0;
        
        let magnitude = 1;
        if (ans >= 10 && ans < 50) magnitude = 2;
        if (ans >= 50 && ans < 200) magnitude = 5;
        if (ans >= 200) magnitude = 10;
        if (ans >= 500) magnitude = 50;

        // 랜덤 오답 생성
        while(options.size < 5 && safeCount < 100) {
            let offset = (Math.floor(Math.random() * 11) - 5) * magnitude;
            let fakeAns = ans + offset;
            
            if(fakeAns > 0 && fakeAns !== ans) {
                options.add(fakeAns);
            }
            safeCount++;
        }
        
        // 만약 못 채웠을 경우 강제 할당
        let fallback = magnitude;
        while(options.size < 5) {
            if (!options.has(ans + fallback)) options.add(ans + fallback);
            fallback += magnitude;
        }

        // 배열로 변환 후 피셔-예이츠 셔플
        let optionsArray = Array.from(options);
        for (let i = optionsArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [optionsArray[i], optionsArray[j]] = [optionsArray[j], optionsArray[i]];
        }

        let optionsHTML = "";
        optionsArray.forEach((opt, index) => {
            optionsHTML += `
                <label class="option-item">
                    <input type="radio" name="answer" value="${opt}">
                    ${index + 1}번. ${opt}${unit}
                </label>
            `;
        });
        document.getElementById('options-list').innerHTML = optionsHTML;
    }

    function checkAnswer() {
        let selected = document.querySelector('input[name="answer"]:checked');
        if (!selected) {
            alert("정답을 선택해주세요!");
            return;
        }
        if (parseFloat(selected.value) === currentCorrectAnswer) {
            alert("🎉 정답입니다! 심화 문제를 맞추셨네요!");
        } else {
            alert(`❌ 아쉽게도 오답입니다. (정답: ${currentCorrectAnswer})\n직렬은 전류가 일정하고, 병렬은 전압이 일정하다는 성질을 다시 떠올려보세요!`);
        }
    }
</script>
